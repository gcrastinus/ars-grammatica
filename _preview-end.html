<!DOCTYPE html>
<meta charset="utf-8">
<title>preview</title>
<iframe id="f" src="index.html" style="position:fixed;inset:0;border:0;width:100%;height:100%"></iframe>
<script>
document.getElementById('f').onload = function(){
  const d = this.contentDocument;
  const last = d.querySelector('#home-acts .act-label:last-of-type') || d.querySelector('#home-acts');
  const t = d.getElementById('home-acts');
  if(t) t.lastElementChild && t.lastElementChild.scrollIntoView();
  d.scrollingElement.scrollTop = d.scrollingElement.scrollHeight;
};
</script>
